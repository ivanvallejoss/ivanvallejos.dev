# Contenido editable de la landing. Cada fase suma su propio bloque.
# El loader lo lee con yaml.safe_load (landing/content_loader.py).

meta:
  title: "Iván Vallejos — Software Developer"
  description: "Construyo y ensamblo los sistemas detrás del producto: del modelo de datos al deploy."

# Secciones ocultables. README del handoff § State Management:
# "Flags de contenido (para decidir en build/CMS)".
flags:
  retrato: true
  escritura: true
  verificable: false
  # A-02 (docs/design/ajustes.md): el selector ES/EN no se muestra hasta que
  # exista la versión en inglés.
  idiomas: false

# Barra superior: texto de la izquierda.
barra:
  texto: "DESARROLLO DE SOFTWARE · ARGENTINA, REMOTO"

# Ítems de la nav y del menú móvil. "Escritura" se oculta con flags.escritura.
nav:
  - href: "#perfil"
    label: "Perfil"
    num: "00"
  - href: "#areas"
    label: "Áreas"
    num: "01"
  - href: "#trabajo"
    label: "Trabajo"
    num: "02"
  - href: "#curso"
    label: "En curso"
    num: "03"
  - href: "#escritura"
    label: "Escritura"
    num: "04"

# Hero (#perfil). README del handoff § Screens / Views, punto 3.
# `destino` es una clave de DESTINATIONS (landing/views.py): el link sale como
# /go/<destino>?a=<audiencia>.
hero:
  kicker: "DESARROLLO DE SISTEMAS A MEDIDA"
  titulo: "Sistemas de backend construidos, desplegados y sostenidos en producción."
  lead: "Diseño el modelo de datos, construyo la aplicación y me hago cargo de la infraestructura donde corre. Trabajo con empresas y particulares que necesitan software que quede operando."
  cta_principal:
    texto: "Consultar disponibilidad"
    destino: contacto
  cta_secundario:
    texto: "Descargar CV (PDF)"
    destino: cv

# Retrato del hero, detrás de flags.retrato. `ruta` es relativa a static/
# (p. ej. "landing/img/retrato.jpg"), 4:5 vertical. Vacía: se muestra el
# placeholder y no se renderiza ningún <img>.
retrato:
  ruta: ""
  alt: "Retrato de Iván Vallejos"
  leyenda: "IVÁN VALLEJOS · BUENOS AIRES"

# Tabla Antecedentes, en la columna derecha del hero.
antecedentes:
  titulo: "ANTECEDENTES"
  filas:
    - label: "Experiencia"
      valor: "+2 años"
    - label: "Formación"
      valor: "Analista en Sistemas"
    - label: "Inglés"
      valor: "C1"
    - label: "Sistemas en producción"
      valor: "1 cliente"
    - label: "Modalidad"
      valor: "Remoto · AR"

# Fila de stack bajo el hero. README § Screens / Views, punto 4.
stack:
  - "Python"
  - "Django"
  - "FastAPI"
  - "Celery"
  - "PostgreSQL"
  - "Redis"
  - "Docker"
  - "Go"
  - "Linux"
  - "pytest"
  - "Sentry"
  - "Cloudflare R2"

# 01 Áreas de trabajo (#areas). README § Screens / Views, punto 5.
areas:
  numero: "01"
  titulo: "Áreas de trabajo"
  items:
    - titulo: "Aplicaciones y APIs"
      texto: "Django y FastAPI: modelado de datos, integraciones, colas de tareas y testing con pytest."
    - titulo: "Infraestructura y operación"
      texto: "Deploy sobre Linux, Docker y VPS, con observabilidad y monitoreo de errores en Sentry."
    - titulo: "Datos y reporting"
      texto: "Ingesta y limpieza con Python y Polars, con salida a tableros para decisiones del negocio."

# 02 Trabajo entregado (#trabajo). README § Screens / Views, punto 6.
# - `slug` arma los ids de las pestañas y la URL del caso (/proyectos/<slug>/).
#   "Ver el caso completo" solo aparece si existe content/casos/<slug>.yaml.
# - En `filas`, `produccion: true` pinta el valor en verde claro.
# - Cada pestaña tiene `tipo`:
#     diagrama   → `contenido` es texto literal (|-): conserva los espacios.
#     pasos      → `contenido` es una lista de textos; el número sale del orden.
#     decisiones → `contenido` es una lista de {titulo, texto}.
# - El `label` de la pestaña se escribe en mayúscula inicial; se ve en
#   mayúsculas por CSS, como el botón del menú.
trabajo:
  numero: "02"
  titulo: "Trabajo entregado"
  nota: "Proyectos operando para terceros."
  cta_caso: "Ver el caso completo →"
  proyectos:
    - slug: bricka
      kicker: "CLIENTE · INMOBILIARIA"
      titulo: "Bricka — CRM inmobiliario"
      parrafo: "CRM a medida para la gestión de propiedades y sus fotos en object storage, operado a diario por el equipo de la agencia. Corre en producción sobre VPS propio con monitoreo de errores."
      filas:
        - label: "Alcance"
          valor: "Datos, aplicación, deploy y operación"
        - label: "Stack"
          valor: "Django · PostGIS · Celery · Cloudflare R2 · Sentry"
        - label: "Estado"
          valor: "En producción desde 2025"
          produccion: true
      nota_codigo: "Código privado"
      pestanas:
        - id: arquitectura
          label: "Arquitectura"
          tipo: diagrama
          contenido: |-
            Equipo de la agencia
              └ Django · PostGIS
                  ├ Celery — fotos → R2
                  └ Sentry — errores
                      └ VPS Linux · Docker
        - id: flujo
          label: "Flujo"
          tipo: pasos
          contenido:
            - "El agente carga la propiedad y sus fotos desde el panel."
            - "Celery procesa las imágenes fuera del request y las sube a R2."
            - "La propiedad queda geolocalizada y buscable por zona."
            - "Si algo falla, el error llega a Sentry antes que el reclamo."
        - id: decisiones
          label: "Decisiones"
          tipo: decisiones
          contenido:
            - titulo: "PostGIS y no lat/lng a mano"
              texto: "La búsqueda por zona es el caso de uso central; delegarla a la base evita filtrar en Python."
            - titulo: "Object storage desde el día uno"
              texto: "Las fotos son el volumen del sistema. En disco del VPS, el backup se vuelve inmanejable."
            - titulo: "Deploy propio, no PaaS"
              texto: "Costo previsible para una agencia chica, a cambio de hacerme cargo de la operación."
      leyenda: "un solo servicio, operación propia"

    - slug: pipeline
      kicker: "CLIENTE · COMERCIO"
      titulo: "Pipeline de ventas y tablero"
      parrafo: "Ingesta y limpieza de ventas con Polars y salida a un tablero en Looker Studio para el seguimiento diario del negocio."
      filas:
        - label: "Alcance"
          valor: "Ingesta, limpieza y reporte"
        - label: "Stack"
          valor: "Python · Polars · Looker Studio"
        - label: "Estado"
          valor: "Entregado · en uso"
      nota_codigo: "Código privado — disponible a pedido en una llamada."
      pestanas:
        - id: flujo
          label: "Flujo"
          tipo: diagrama
          contenido: |-
            Exports de ventas
              └ Python · Polars
                  ├ normalización
                  └ validación
                      └ Looker Studio
        - id: decisiones
          label: "Decisiones"
          tipo: decisiones
          contenido:
            - titulo: "Polars sobre pandas"
              texto: "Los exports crecen mes a mes; el consumo de memoria dejó de ser un problema."
            - titulo: "Validar antes de cargar"
              texto: "Un dato roto en el tablero cuesta más que una corrida que falla temprano y avisa."
            - titulo: "Looker Studio y no un dashboard propio"
              texto: "El cliente ya lo usaba. Mantener una app más no le sumaba nada."
      leyenda: "corrida diaria, sin intervención manual"

# 03 En curso (#curso). README § Screens / Views, punto 7.
# - `estado.tipo` es `dev` (EN DESARROLLO, siena claro) o `form` (FORMACIÓN,
#   atenuado). `estado.texto` va en mayúscula inicial; se ve en mayúsculas por CSS.
# - `stack` y `link` son opcionales. `link.destino` es una clave de
#   DESTINATIONS (landing/views.py): sale como /go/<destino>?a=<audiencia>.
curso:
  numero: "03"
  titulo: "En curso"
  nota: "Actualizado 12 sep 2026"
  items:
    - nombre: "SmartExpense"
      estado:
        tipo: dev
        texto: "En desarrollo"
      descripcion: "Gestión de gastos sobre arquitectura asíncrona desacoplada: receiver en Go que responde de inmediato y encola con manejo idempotente (Redis SETNX + TTL), y workers en Python que categorizan y persisten en background. 151 tests validando contratos de API e integración."
      stack: "Go · Python · Redis · ARQ · pytest"
      link:
        texto: "↗ GitHub"
        destino: smartexpense
    - nombre: "Bricka · fase 2"
      estado:
        tipo: dev
        texto: "En desarrollo"
      descripcion: "Publicación automática de listados hacia plataformas externas desde el CRM, con reintentos y trazabilidad de cada publicación."
      stack: "Django · Celery · APIs externas"
    - nombre: "Go e ingeniería de datos"
      estado:
        tipo: form
        texto: "Formación"
      descripcion: "Go como segundo lenguaje e ingeniería de datos. Lo que estoy incorporando, no lo que vendo todavía — lo escribo en el blog mientras avanza."
      link:
        texto: "↗ Notas en el blog"
        destino: blog

# 04 Escritura técnica (#escritura), detrás de flags.escritura.
# README § Screens / Views, punto 8.
# - Los posts se cargan a mano. `url` es la del post y va directa, sin /go/.
#   Mientras no haya posts reales, van los del prototipo apuntando al blog.
# - El template arma la línea de arriba como "<fecha> · <minutos> MIN".
# - `blog.destino` es una clave de DESTINATIONS: sale como /go/blog?a=<audiencia>.
escritura:
  numero: "04"
  titulo: "Escritura técnica"
  blog:
    texto: "↗ Ver el blog completo"
    destino: blog
  posts:
    - titulo: "Cómo estructuro el logging de un Django en producción"
      fecha: "12 JUL 2026"
      minutos: 6
      url: "https://blog.ivanvallejos.dev"
    - titulo: "Idempotencia en workers: qué testeo"
      fecha: "JUN 2026"
      minutos: 8
      url: "https://blog.ivanvallejos.dev"
    - titulo: "De SQLite a PostgreSQL sin drama"
      fecha: "MAY 2026"
      minutos: 5
      url: "https://blog.ivanvallejos.dev"

# 05 Verificable, detrás de flags.verificable. README § Screens / Views, punto 9.
# Copy pendiente de reescritura: "Código público" contradice que el código de
# Bricka es privado. El flag sigue apagado hasta que Ivan lo reescriba.
verificable:
  label: "05 — VERIFICABLE"
  frase: "Todo lo que afirmo acá se puede comprobar."
  filas:
    - label: "Cliente en producción"
      texto: "Un equipo depende de Bricka a diario. No es un proyecto de práctica."
    - label: "Código público"
      texto: "Los proyectos principales están en GitHub con su historia de commits."
    - label: "Blog activo"
      texto: "Escribo sobre decisiones, errores y operación de sistemas reales."
    - label: "Criterios de trabajo"
      texto: "Testing con pytest, monitoreo con Sentry y deploy propio sobre VPS."

# Contacto (#contacto). README § Screens / Views, punto 10.
# - `tono` pinta el kicker: `accent` (verde claro) o `signal` (siena claro).
# - `cta.variante` es el modificador de .btn: `outline` o `primary`.
# - `cta.destino` es una clave de DESTINATIONS: sale como /go/<destino>?a=<audiencia>.
contacto:
  celdas:
    - kicker: "PARA EQUIPOS Y RECRUITERS"
      tono: accent
      titulo: "Busco mi primer rol formal"
      texto: "Backend con Python, con disposición a hacerme cargo de infraestructura. CV y referencias técnicas a disposición."
      cta:
        texto: "Descargar CV"
        destino: cv
        variante: outline
    - kicker: "PARA EMPRESAS Y PARTICULARES"
      tono: signal
      titulo: "Tomo proyectos freelance"
      texto: "Desarrollo a medida, con alcance y entrega acordados por escrito. Primera llamada sin costo para evaluar el problema."
      cta:
        texto: "Agendar una llamada"
        destino: contacto
        variante: primary
